<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;animation:flash .5s infinite}
@keyframes flash{0%,100%{background:#000}50%{background:#5a0000}}
@keyframes shake{0%{transform:translate(2px,1px)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(1px,2px)}}
.box{border:3px solid #f00;background:rgba(0,0,0,.85);padding:20px;max-width:360px;width:100%;text-align:center;animation:shake .15s infinite;box-shadow:0 0 40px #f00}
h1{color:#f00;font-size:1.9rem;margin:6px 0}
#log{text-align:left;font-size:.8rem;height:110px;overflow:hidden;margin:12px 0}
#pct{color:#ff0}#cd{color:#f00;font-weight:bold}
</style>
</head>
<body>
<div class="box" id="box">
  <div style="font-size:3rem">☠️</div>
  <h1 id="t">YOU'VE BEEN HACKED</h1>
  <div id="log"></div>
  <div id="pct">Uploading files: 0%</div>
  <div id="cd">Deleting everything in 8…</div>
</div>
<script>
var lines=["> bypassing firewall...","> access granted","> reading messages...","> copying photos...","> downloading contacts...","> uploading to server...","> disabling antivirus...","> installing trojan.exe..."];
var log=document.getElementById('log'),pct=document.getElementById('pct'),cd=document.getElementById('cd');
var i=0,p=0,c=8;
var li=setInterval(function(){log.innerHTML+=lines[i%lines.length]+"<br>";log.scrollTop=log.scrollHeight;i++;},450);
var pi=setInterval(function(){p=Math.min(99,p+Math.floor(Math.random()*9)+2);pct.textContent="Uploading files: "+p+"%";},300);
var ci=setInterval(function(){c--;if(c>0){cd.textContent="Deleting everything in "+c+"…";}else{finish();}},1000);
function finish(){
  clearInterval(li);clearInterval(pi);clearInterval(ci);
  document.body.style.animation='none';document.body.style.background='#052e16';
  var b=document.getElementById('box');b.style.animation='none';b.style.borderColor='#16a34a';b.style.boxShadow='0 0 40px #16a34a';
  var t=document.getElementById('t');t.textContent='Joke SHHSHSHHAHQ';t.style.color='#22c55e';
  log.innerHTML='Nothing was hacked.<br>You just got pranked!';
  pct.textContent='';cd.textContent='';
}
</script>
</body>
</html>
